<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NULL_LINK // INTERACTIVE</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0a0a0a; color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        #content { padding: 40px; }

        /* Animation class */
        .animate-text { visibility: hidden; }

        /* Bottom Dock Layout */
        .dock {
            position: fixed; bottom: 0; width: 100%; height: 70px;
            background-color: #000000; display: flex;
            justify-content: space-around; align-items: center;
            border-top: 1px solid #ffffff; z-index: 1000;
        }

        .icon {
            font-size: 24px; cursor: pointer; color: #ffffff;
            transition: color 0.3s;
        }
        .icon:hover { color: #00ffcc; }
    </style>
</head>
<body>

    <div id="content">
        <h1 class="animate-text">NULL_LINK_SYSTEM</h1>
        <p class="animate-text">// SYSTEM_INIT / Connection established...</p>
        <p class="animate-text">Welcome, Architect. Interface Ready.</p>
    </div>

    <!-- Icon Dock -->
    <div class="dock">
        <div class="icon" onclick="alert('Menu')">☰</div>
        <div class="icon" onclick="alert('Web')">🌐</div>
        <div class="icon" onclick="alert('Chat')">💬</div>
        <div class="icon" onclick="alert('Games')">🎮</div>
        <div class="icon" onclick="alert('Media')">🎬</div>
        <div class="icon" onclick="alert('Audio')">🎵</div>
        <div class="icon" onclick="alert('Art')">🎨</div>
        <div class="icon" onclick="alert('User')">👤</div>
        <div class="icon" onclick="alert('Settings')">⚙️</div>
    </div>

    <script>
        async function typeWriterEffect() {
            const elements = document.querySelectorAll('.animate-text');
            for (let el of elements) {
                el.style.visibility = 'visible';
                const text = el.innerHTML;
                el.innerHTML = '';
                for (let i = 0; i < text.length; i++) {
                    el.innerHTML += text.charAt(i);
                    await new Promise(resolve => setTimeout(resolve, 20));
                }
                await new Promise(resolve => setTimeout(resolve, 100));
            }
        }
        window.onload = typeWriterEffect;
    </script>
</body>
</html>
