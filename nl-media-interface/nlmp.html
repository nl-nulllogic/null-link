<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NULL_LINK Interface</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            color: #00ff41; /* Classic terminal green */
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        /* Bottom Dock Layout */
        .dock {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 70px;
            background-color: #000000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 2px solid #333;
        }

        .icon {
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
            color: #ffffff;
        }

        .icon:hover {
            transform: scale(1.2);
            color: #00ff41;
        }

        /* Content area for your apps */
        #content {
            padding: 20px;
        }
    </style>
</head>
<body>

    <div id="content">
        <h1>NULL_LINK_SYSTEM</h1>
        <p>System Ready...</p>
    </div>

    <!-- Icon Dock -->
    <div class="dock">
        <div class="icon" onclick="alert('Menu clicked')">☰</div>
        <div class="icon" onclick="alert('Web clicked')">🌐</div>
        <div class="icon" onclick="alert('Chat clicked')">💬</div>
        <div class="icon" onclick="alert('Games clicked')">🎮</div>
        <div class="icon" onclick="alert('Media clicked')">🎬</div>
        <div class="icon" onclick="alert('Audio clicked')">🎵</div>
        <div class="icon" onclick="alert('Art clicked')">🎨</div>
        <div class="icon" onclick="alert('User clicked')">👤</div>
        <div class="icon" onclick="alert('Settings clicked')">⚙️</div>
    </div>

    <script>
        // Use this space for your LSL-to-Web messaging logic
        console.log("Interface Initialized");
    </script>
</body>
</html>
